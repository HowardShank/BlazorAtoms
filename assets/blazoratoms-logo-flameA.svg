<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" width="430" height="128" role="img" aria-label="Blazor Elements">
  <!-- Lockup with flame variant A (twin-tongue / flickery). -->
  <title>Blazor Elements</title>
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#EA5E0B"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="0.55" stop-color="#FF9A2E"/>
      <stop offset="1" stop-color="#F2530E"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="1" stop-color="#FFB03A"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB258" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB258" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A2E"/>
      <stop offset="1" stop-color="#EA5E0B"/>
    </linearGradient>
  </defs>

  <!-- tile mark (no inner ELEMENTS text; the wordmark carries it) -->
  <g>
    <rect x="14" y="28" width="100" height="84" rx="16"
          fill="url(#tileGrad)" stroke="#C24E06" stroke-width="2"/>
    <circle cx="64" cy="30" r="24" fill="url(#emberGlow)"/>
    <path d="M64 47 C 55 47, 49 42, 50 34 C 51 27, 56 26, 57 20 C 58 15, 55 12, 58 7 C 60 11, 61 16, 63 17 C 64 12, 63 8, 65 5 C 68 11, 69 17, 72 22 C 76 28, 79 31, 79 37 C 79 43, 73 47, 64 47 Z"
          fill="url(#flameGrad)"/>
    <path d="M64 22 C 59 28, 57 31, 57 37 C 57 42, 60 45, 64 45 C 68 45, 71 42, 71 37 C 71 32, 68 30, 66 24 C 65 22, 65 20, 64 22 Z"
          fill="url(#flameInner)"/>
    <text x="29" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="16" font-weight="600" fill="#FFE8D6">4</text>
    <text x="64" y="98" text-anchor="middle"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="48" font-weight="700" fill="#FFFFFF">Be</text>
  </g>

  <!-- wordmark: Blazor (neutral) over Elements (orange primary) -->
  <text x="140" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="500" letter-spacing="0.5" fill="#6B6B6B">Blazor</text>
  <text x="138" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="46" font-weight="800" letter-spacing="0.5" fill="url(#wordGrad)">Elements</text>
</svg>
